
FedNCF_ml1m_triple_full_momentum:
    seed: 2024
    model: FedNCF_Full_Momentum
    local_epoch: 2
    metrics: ['logloss', 'MRR', 'NDCG(5)', 'HR(5)', 'NDCG(10)', 'HR(10)', 'NDCG(20)', 'HR(20)', 'NDCG(50)', 'HR(50)']
    task: 'triple'
    train_turn: 1000
    embedding_dim: 32
    hidden_activations: ReLU
    hidden_units: [64, 128, 64]
    output_dim: 1
    latent_dim: 4
    dropout: 0.5
    only_inter: false
    embedding_regularizer: 1.e-8
    net_regularizer: 1.e-8
    learning_rate: 1.e-3
    optimizer: adam
    loss_fn: 'bpr_loss'
    pre_epoch: 3000
    # Dataset (ML-1M)
    dataset_id: ML1M_t5
    dataloader: MLDataLoaderFL
    clients_num_per_turn: 604
    # Server momentum for full item embedding matrix
    server_optimizer: heavyball   # none | ema | heavyball
    beta: 0.9
    eta_s: 1.0

